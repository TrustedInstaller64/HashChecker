name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        # Multi-config generators (Visual Studio) ignore CMAKE_BUILD_TYPE and build
        # Debug by default, so pass the configuration explicitly.
        run: cmake --build build --parallel --config ${{ matrix.build_type }}
      - name: Test
        # Multi-config generators (Visual Studio) need the configuration; harmless elsewhere.
        run: cd build && ctest -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan Build & Test
        run: |
          cmake -B build_asan -DENABLE_ASAN=ON
          cmake --build build_asan
          cd build_asan && ctest --output-on-failure
      - name: TSan Build & Test
        run: |
          cmake -B build_tsan -DENABLE_TSAN=ON
          cmake --build build_tsan
          cd build_tsan && ctest --output-on-failure
      - name: UBSan Build & Test
        run: |
          cmake -B build_ubsan -DENABLE_UBSAN=ON
          cmake --build build_ubsan
          cd build_ubsan && ctest --output-on-failure

  lint:
    # The sources predate the formatter version installed here, so formatting and
    # tidy findings are advisory (they do not fail the workflow). Vendored code under
    # tests/third_party is excluded from the format check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tools
        run: sudo apt-get install -y clang-format clang-tidy
      - name: clang-format check
        continue-on-error: true
        run: find src tests \( -name '*.h' -o -name '*.cpp' \) -not -path '*/third_party/*' | xargs clang-format --dry-run --Werror
      - name: clang-tidy
        continue-on-error: true
        run: |
          cmake -B build_lint -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          find src/ -name '*.cpp' | xargs run-clang-tidy -p build_lint
